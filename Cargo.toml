[package]
name = "fuaran-core"
version = "0.0.5-alpha.1"
edition = "2024"
# The minimum the gate runs at, exactly: CI's minimum job and run.ps1 read this line, "1.85" as 1.85.0 (DECISIONS.md D15, D16).
# Edition 2024 needs 1.85.
rust-version = "1.85"
description = "The Fuaran Core spine in Rust: canonical JSON, the number form, content addresses, tree and op apply, the op-stream chain, the DAG with its reconcile and diff, and the columnar, capability (with its gate, decision context and grant, and the document value space), query (the declaration, its admission gate and the grant for a read, decided by the capability registry's own decision), propagation and seam contracts, certified against the reference's conformance vectors."
license = "Apache-2.0"
repository = "https://github.com/Fuaran-Core/fuaran-core-rs"
readme = "README.md"
publish = false

[lib]
name = "fuaran_core"

[features]
default = []
std = []

[dependencies]

# `cfg(kani)` is set by the Kani model checker, which builds the harnesses in
# verification/kani/, and `cfg(creusot)` by Creusot, which compiles src/json/escape.rs
# inside the proof crate in verification/creusot/escape/ (see verification/README.md);
# nothing else sets either.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(creusot)"] }
