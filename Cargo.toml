[package]
name = "fuaran-core"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "The Fuaran Core spine in Rust: canonical JSON, the number form, content addresses, tree and op apply, the op-stream chain, the DAG with its reconcile and diff, and the columnar, capability, propagation and seam contracts, certified against the reference's conformance vectors."
license = "Apache-2.0"
repository = "https://github.com/Fuaran-Core/fuaran-core-rs"
readme = "README.md"
publish = false

[lib]
name = "fuaran_core"

[features]
default = []
std = []

[dependencies]

# `cfg(kani)` is set by the Kani model checker, which builds the harnesses in
# verification/kani/, and `cfg(creusot)` by Creusot, which compiles src/json/escape.rs
# inside the proof crate in verification/creusot/escape/ (see verification/README.md);
# nothing else sets either.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(creusot)"] }
