[package]
name = "fuaran-core"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "The Fuaran Core spine in Rust: canonical JSON, the number form, content addresses, tree and op apply, the op-stream chain and the DAG."
license = "Apache-2.0"
repository = "https://github.com/Fuaran-Core/fuaran-core-rs"
readme = "README.md"
publish = false

[lib]
name = "fuaran_core"

[features]
default = []
std = []

[dependencies]

# `cfg(kani)` is set by the Kani model checker, which builds the harnesses in
# verification/kani/ (see verification/README.md); nothing else sets it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
