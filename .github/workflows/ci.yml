# Build, test and conformance gate for the Rust Core spine.
#
# Layout: this repository and the Core checkout its conformance legs read sit side by side,
#
#     $GITHUB_WORKSPACE/
#     ├── fuaran-core-rs/   <- this repository
#     └── fuaran-core/      <- Fuaran-Core/fuaran-core, AT the commit core-pin.json names
#
# so tests/conformance.rs resolves `../fuaran-core` with no override. The checkout is pinned: the
# spine certifies against the vectors of one Core commit, and moving to another is a deliberate
# change here (core-pin.json), never something a push to Core does to this build.
#
# The whole gate is run.ps1, so CI and the one-command entry point cannot diverge. It runs in two
# jobs (DECISIONS.md D15): at stable, with the format check and the lints, and at the minimum Rust
# version Cargo.toml declares (`rust-version`, read from the manifest, so the workflow names no
# version of its own), where run.ps1 -MinimumOnly fails unless that toolchain and its embedded
# target are installed, so a green minimum job is one whose legs ran.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: gate (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            components: --component rustfmt --component clippy
            gate: -SkipMinimum
          - toolchain: minimum
            components: ""
            gate: -MinimumOnly
    defaults:
      run:
        working-directory: fuaran-core-rs
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-core-rs

      - name: Read the Core pin
        id: pin
        run: |
          echo "repository=$(jq -r .repository core-pin.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .sha core-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Check out Core at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.sha }}
          path: fuaran-core

      - name: Assert Core is where the tests resolve it
        run: test -f ../fuaran-core/conformance/apply/manifest.json

      - name: Resolve the toolchain
        id: toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = "minimum" ]; then
            v=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
            test -n "$v" || { echo "Cargo.toml declares no rust-version"; exit 1; }
            # The exact floor: a declared version with no patch component is read as .0, so "1.85" is 1.85.0 and
            # not whatever patch rustup resolves the bare name to; three components are taken as written.
            case "$v" in
              *.*.*) ;;
              *.*) v="$v.0" ;;
              *) echo "Cargo.toml's rust-version '$v' is not major.minor or major.minor.patch"; exit 1 ;;
            esac
          else
            v=stable
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "toolchain: $v"

      # rustup is preinstalled on the runner, so the toolchain is installed directly rather than
      # through a third-party action referenced by a moving branch name.
      - name: Set up Rust
        run: |
          rustup toolchain install ${{ steps.toolchain.outputs.name }} --profile minimal ${{ matrix.components }}
          rustup default ${{ steps.toolchain.outputs.name }}
          rustup target add thumbv7em-none-eabihf --toolchain ${{ steps.toolchain.outputs.name }}
          rustc --version && cargo --version

      - name: Gate (run.ps1 ${{ matrix.gate }})
        shell: pwsh
        run: ./run.ps1 ${{ matrix.gate }}
